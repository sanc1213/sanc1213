<svg width="620" height="60" viewBox="0 0 620 60" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur">
        <animate attributeName="stdDeviation" values="2.5;5;2.5" dur="2.5s" repeatCount="indefinite" />
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <text x="50%" y="38" text-anchor="middle" filter="url(#glow)"
        font-family="'Fira Code', 'Courier New', monospace" font-size="24" font-weight="700"
        fill="#ff0055">
    Sanchit&#160;Singh&#160;·&#160;Full-Stack&#160;+&#160;AI&#160;Developer
    <animate attributeName="fill"
      values="#ff0055;#ff8a00;#ffee00;#33ff33;#00e5ff;#3377ff;#b347ff;#ff2ec4;#ff0055"
      dur="6s" repeatCount="indefinite" />
  </text>
</svg>
